# Fijar las acciones por SHA las vuelve inmutables, pero también las congela: si una
# publica un parche de seguridad, nadie se entera. Dependabot abre un PR con el SHA
# nuevo. El cooldown evita saltar a una versión recién publicada, que es justo el
# escenario del ataque a tj-actions/changed-files en 2025.
#
# La revisión es DIARIA, no semanal. Parece lo contrario de prudente y no lo es: lo
# peligroso no es enterarse pronto de una versión nueva, es instalarla el día que
# sale. De eso se encarga el cooldown, que no deja proponer nada antes de que lleve
# unos días publicado. Con las dos cosas juntas me entero rápido de un parche que ya
# estuvo expuesto al escrutinio de otros, que es exactamente lo que quiero. Con
# "weekly" el aviso puede tardar casi una semana de más, sumado al cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      # Solo default-days. Los semver-*-days NO existen para github-actions, y
      # Dependabot no se queja a medias: rechaza el archivo COMPLETO y deja de
      # revisar los tres ecosistemas. Lo tuve dos dias asi sin enterarme.
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directories: ["/", "/api"]
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directories: ["/web", "/api", "/db"]
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    ignore:
      # Node numera las lineas impares como "current": soporte corto y sin LTS.
      # Una imagen que sirve una aplicacion tiene que ir sobre una LTS, asi que
      # estas no se proponen. Las pares siguen llegando.
      - dependency-name: node
        versions: ["23.x", "25.x", "27.x", "29.x"]
