# Pipeline CI/CD de demo-cicd. LAB-04, IF-1116.
#
# Un job por etapa, encadenados con needs. Si uno falla, los siguientes no corren.
# Las acciones van fijadas por SHA (el tag queda como comentario): un tag se puede
# mover a otro código, un SHA no. Así se comprometió tj-actions/changed-files en 2025.
#
#   lint ──┬─> test-unit ─> test-integration ─┐
#   sast ──┴─────────────────────────────────-┴─> package ─> security ─> deploy-dev ─> deploy-staging
#
name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: por defecto solo lectura. Cada job pide lo suyo.
permissions:
  contents: read

# En un PR, cada push nuevo deja obsoleto al anterior: no tiene sentido seguir
# construyendo tres imágenes de un commit que ya nadie va a mezclar. En main NO se
# cancela: un run de main puede estar desplegando, y cortarlo a media faena deja el
# ambiente en un estado que nadie pidió.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# El shell por defecto de Actions es "bash -e", SIN pipefail: en una tubería solo
# cuenta el código de salida del ÚLTIMO comando. Por eso un paso como
# "npm test | tee salida.txt" quedaba en verde aunque las pruebas fallaran, y la
# compuerta de pruebas dejaba de existir sin que nadie se enterara.
# Declarando "shell: bash", Actions usa "bash --noprofile --norc -eo pipefail".
defaults:
  run:
    shell: bash

env:
  NODE_VERSION: "24"

jobs:
  lint:
    name: 1. Lint (ESLint, HTMLHint, Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm ci --prefix api
      - run: npm run lint
      - name: Hadolint sobre los tres Dockerfiles
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          recursive: true
          config: .hadolint.yaml
          failure-threshold: warning

  sast:
    name: 2. SAST (Semgrep) y secretos (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # TruffleHog revisa TODO el historial, no solo el último commit
      - name: Semgrep, análisis estático del código
        run: >
          docker run --rm -v "$PWD:/src:ro" semgrep/semgrep:1.180.0
          semgrep scan --config p/ci --config p/dockerfile --config p/javascript
          --error --metrics=off /src
      # B2, cambio 1: TruffleHog en lugar de Gitleaks. Los dos recorren el historial
      # de Git buscando secretos; la diferencia es que TruffleHog además VERIFICA si
      # la credencial sigue viva contra el servicio que la emitió. Eso separa un
      # secreto real y explotable de una cadena que solo parece una llave.
      # --fail devuelve código distinto de cero cuando encuentra algo: la etapa frena.
      # TruffleHog, por defecto, recorre TODAS las ramas del repositorio. Suena
      # mejor y en este repositorio deja la compuerta inservible: las ramas
      # romper/* se quedan abiertas a propósito y una lleva un secreto a
      # propósito, así que el escaneo completo sale en rojo SIEMPRE, en
      # cualquier rama. Una compuerta que no puede ponerse verde no frena nada:
      # se desactiva o se ignora, y acaba siendo peor que no tenerla.
      # Se escanea el historial alcanzable desde lo que se va a mezclar, que es
      # la pregunta que esta compuerta tiene que responder. Que un secreto en
      # otra rama siga estando filtrado es cierto, y se arregla rotándolo, no
      # dejando el pipeline en rojo para siempre.
      - name: TruffleHog, secretos en el historial de Git
        run: |
          # "escaneo" apunta a lo que se va a mezclar: en un PR, la rama ya unida
          # contra main; en main, main. HEAD queda suelto y --branch pide un nombre.
          git branch -f escaneo HEAD
          docker run --rm -v "$PWD:/repo:ro" trufflesecurity/trufflehog:3.99.7 \
            git file:///repo --no-update --fail --results=verified,unknown --branch escaneo

  test-unit:
    name: 3. Pruebas unitarias y del sitio
    # B6: antes esperaba a lint. Un error de estilo no invalida una prueba, y una
    # prueba rota no se arregla formateando: son compuertas independientes. Las dos
    # siguen siendo obligatorias para mezclar, pero ya no en fila india.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm ci --prefix api
      - run: npm run test:unit 2>&1 | tee unit.txt
      - run: npm run test:site 2>&1 | tee site.txt
      # Una regla de alerta es código: tiene lógica, tiene casos borde y se puede
      # equivocar. La de 5xx divide entre el total de peticiones, y sin tráfico esa
      # división es 0/0: mal escrita, se queda callada cuando debería avisar, o
      # avisa cuando no pasa nada. Eso no se comprueba mirando una gráfica un rato.
      # promtool le mete series de entrada y afirma qué debe y qué NO debe disparar.
      - name: Pruebas de las reglas de alerta (promtool)
        run: >
          docker run --rm -v "$PWD/k8s/observabilidad:/r:ro" -w /r
          --entrypoint promtool prom/prometheus:v3.15.1
          test rules pruebas-alertas.yml 2>&1 | tee alertas.txt
      - name: Resumen de las pruebas
        if: always()
        run: |
          {
            echo "## Pruebas"
            echo ""
            echo "| Suite | Resultado |"
            echo "|---|---|"
            echo "| Unitarias (API) | $(grep -oE 'Tests[[:space:]]+[0-9]+ passed' unit.txt | tail -1 || echo 'ver log') |"
            echo "| Sitio | $(grep -oE 'Tests[[:space:]]+[0-9]+ passed' site.txt | tail -1 || echo 'ver log') |"
            echo "| Reglas de alerta | $(grep -qE '^\s*SUCCESS' alertas.txt && echo 'las 3 en verde' || echo 'ver log') |"
          } >> "$GITHUB_STEP_SUMMARY"

  test-integration:
    name: 4. Pruebas de integración (Compose)
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Levantar la aplicación
        # El runner no tiene mi .env: se genera una contraseña al vuelo, igual que
        # haría un Codespace recién creado.
        run: |
          echo "DB_PASSWORD=$(openssl rand -hex 12)" > .env
          docker compose up -d --build --wait
      - run: npm run test:integration
      - name: Logs de los contenedores (solo si algo falló)
        if: failure()
        run: docker compose logs
      - name: Apagar
        if: always()
        run: docker compose down -v

  package:
    name: 5. Empaquetar y publicar (${{ matrix.servicio }})
    # B6: antes esperaba a test-integration (39 s en el camino crítico). Publicar una
    # imagen no es desplegarla: si la integración falla, la compuerta de DEV lo frena
    # igual, porque deploy-dev necesita a las dos. Lo único que se pierde si falla es
    # una imagen publicada que nadie usa.
    needs: sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # lo único que este job necesita de más
    strategy:
      matrix:
        servicio: [web, api, db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGEN=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/demo-cicd-${{ matrix.servicio }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGEN }}
          tags: type=sha,format=long,prefix=sha-
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.servicio }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  security:
    name: 6. Escaneo de imagen (${{ matrix.servicio }})
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # descargar la imagen, no publicarla
    strategy:
      matrix:
        servicio: [web, api, db]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Nombre de la imagen
        run: |
          echo "IMAGEN=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/demo-cicd-${{ matrix.servicio }}" >> "$GITHUB_ENV"
          echo "TRIVY_CACHE_DIR=${GITHUB_WORKSPACE}/.cache/trivy" >> "$GITHUB_ENV"
      # B6: la base de datos de vulnerabilidades pesa cientos de MB y Trivy la
      # descarga en cada job. Se guarda entre runs, con una clave por servicio.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ matrix.servicio }}-${{ github.run_id }}
          restore-keys: trivy-db-${{ matrix.servicio }}-
      # Informe completo, para el resumen del run. No decide: solo cuenta.
      - name: Trivy, informe en JSON
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGEN }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH,MEDIUM
          format: json
          output: trivy.json
      - name: Resumen de vulnerabilidades
        if: always()
        run: |
          resumen=$(node -e '
            const fs = require("fs");
            let d; try { d = JSON.parse(fs.readFileSync("trivy.json", "utf8")); }
            catch { console.log("(sin informe)"); process.exit(0); }
            const n = {};
            for (const r of d.Results || [])
              for (const v of r.Vulnerabilities || []) n[v.Severity] = (n[v.Severity] || 0) + 1;
            console.log(Object.entries(n).map(([k, c]) => k + ": " + c).join(", ") || "sin hallazgos");
          ')
          echo "- **${{ matrix.servicio }}**: $resumen" >> "$GITHUB_STEP_SUMMARY"
      # La compuerta: CRITICAL y HIGH con parche disponible frenan el pipeline.
      # Nunca se baja la severidad ni se pone exit-code 0: lo aceptado va en
      # .trivyignore, una línea por CVE y con su motivo escrito.
      - name: Frenar si hay CRITICAL o HIGH con parche
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGEN }}:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
          trivyignores: .trivyignore
          skip-setup-trivy: true

  deploy-dev:
    name: 7. Deploy DEV (efímero) y smoke
    # La compuerta sigue entera: nada llega a DEV sin que pasen el escaneo Y las
    # pruebas de integración. Adelantar trabajo no es saltarse un control.
    needs: [security, test-integration]
    if: github.event_name != 'pull_request' # un PR nunca despliega
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: echo "PREFIJO=ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/demo-cicd" >> "$GITHUB_ENV"
      # Un clúster que nace y muere con este job: eso es un ambiente efímero.
      #
      # B2, cambio 2: k3d en lugar de kind. kind levanta Kubernetes "vanilla"; k3d
      # levanta k3s, que es exactamente la distribución que corre mi Rancher Desktop
      # en STAGING. Así DEV y STAGING comparten distribución y lo que pasa en uno
      # predice lo que pasa en el otro. Además arranca más rápido, porque k3s trae
      # menos componentes.
      # La acción AbsaOSS/k3d-action@v2.4.0 falla: descarga una versión de k3d que ya
      # no existe y devuelve 404. Se instala el binario directamente, con la versión
      # fija: mismo criterio que fijar las acciones por SHA, y sin ejecutar un script
      # remoto con "curl | bash", que es justo el patrón de ataque a la cadena de
      # suministro que el Reto 4 del LAB-03 me hizo estudiar.
      - name: Crear el clúster (k3d)
        run: |
          curl -sSLf -o /tmp/k3d https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          sudo install -m 0755 /tmp/k3d /usr/local/bin/k3d
          k3d version
          k3d cluster create dev --wait
      - name: Namespace y secretos
        run: |
          kubectl create namespace demo-dev
          kubectl -n demo-dev create secret docker-registry ghcr \
            --docker-server=ghcr.io --docker-username="${{ github.actor }}" --docker-password="${{ secrets.GITHUB_TOKEN }}"
          kubectl -n demo-dev create secret generic db-credenciales --from-literal=DB_PASSWORD="$(openssl rand -hex 16)"
      - name: Desplegar
        run: scripts/desplegar.sh k8s/overlays/dev "$PREFIJO" "sha-${{ github.sha }}"
      - name: Esperar el rollout
        run: |
          kubectl -n demo-dev rollout status deploy/db  --timeout=180s
          kubectl -n demo-dev rollout status deploy/api --timeout=180s
          kubectl -n demo-dev rollout status deploy/web --timeout=180s
      - name: Smoke test y pruebas de integración contra DEV
        run: |
          kubectl -n demo-dev port-forward svc/web 8080:80 &
          sleep 3
          bash scripts/smoke.sh http://localhost:8080
          APP_URL=http://localhost:8080 npm run test:integration
      # Reto 1: DAST. El SAST revisa el código quieto; esto ataca la aplicación
      # corriendo. Aprovecha que DEV ya está levantado dentro de este mismo runner.
      - name: DAST con OWASP ZAP contra DEV
        run: |
          mkdir -p zap-salida && chmod 777 zap-salida
          docker run --rm --network host             -v "$PWD/zap-salida:/zap/wrk:rw" -v "$PWD/.zap:/zap/conf:ro"             ghcr.io/zaproxy/zaproxy:2.16.1             zap-baseline.py -t http://localhost:8080             -r informe-zap.html -c /zap/conf/rules.tsv

      - name: Guardar el informe de ZAP
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informe-zap
          path: zap-salida/

      - name: Diagnóstico (solo si algo falló)
        if: failure()
        run: |
          kubectl -n demo-dev get all
          kubectl -n demo-dev describe pods
          kubectl -n demo-dev logs -l app=api --tail=50 || true
          kubectl -n demo-dev logs -l app=db  --tail=50 || true

  deploy-staging:
    name: 8. Deploy STAGING (con aprobación)
    needs: deploy-dev
    if: github.event_name != 'pull_request'
    # Lo descubrí mezclando varios PR seguidos: se me apilaron SEIS runs esperando
    # aprobación, uno por commit. Y eso no es solo ruido en la pestaña Actions: si
    # las apruebo en el orden en que aparecen, el último despliegue que gana es el
    # del commit más VIEJO. El pipeline me estaba ofreciendo desplegar hacia atrás.
    #
    # Con un grupo de concurrencia por ambiente, un commit nuevo cancela la
    # aprobación pendiente del anterior: solo se puede aprobar lo último, que es lo
    # único que tiene sentido desplegar. A diferencia del grupo del workflow, aquí
    # sí cancelo, porque lo que se cancela es una espera, no un trabajo en curso.
    concurrency:
      group: ambiente-staging
      cancel-in-progress: true
    # Corre en MI máquina: el clúster de STAGING es mi Rancher Desktop, y GitHub no
    # puede alcanzarlo desde fuera. Por eso hace falta un runner self-hosted.
    runs-on: self-hosted
    environment:
      name: staging
      url: http://localhost:30090
    defaults:
      run:
        # Mi runner es Windows y este es el único job que corre ahí. Con "shell: bash"
        # el runner resuelve el stub de WSL (WindowsApps\bash.EXE) y el job muere con
        # "execvpe(/bin/bash): No such file or directory", porque instalé WSL sin
        # distribución: la suya la trae Rancher Desktop. Dar la ruta absoluta de Git
        # Bash como shell tampoco sirve: el runner la pasa por un Path.Combine y
        # revienta con "Second path fragment must not be a drive or UNC name".
        # powershell es el shell que el runner de Windows resuelve siempre (pwsh no
        # está instalado). Donde hace falta bash de verdad —los scripts del
        # repositorio— se invoca el ejecutable de Git Bash a mano, que además
        # conserva el -eo pipefail que el resto del pipeline necesita.
        shell: powershell
    env:
      GIT_BASH: C:\Program Files\Git\bin\bash.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Calcular el prefijo de las imágenes
        # Se escribe con .NET y no con Out-File porque Windows PowerShell 5.1 le
        # mete un BOM al principio del archivo, y un BOM pegado a la primera línea
        # de GITHUB_ENV convierte el nombre de la variable en otro nombre.
        run: |
          $propietario = "${{ github.repository_owner }}".ToLower()
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "PREFIJO=ghcr.io/$propietario/demo-cicd`n", $utf8)
      - name: Desplegar la misma imagen que pasó por DEV
        run: |
          & $env:GIT_BASH -eo pipefail scripts/desplegar.sh k8s/overlays/staging $env:PREFIJO "sha-${{ github.sha }}"
          exit $LASTEXITCODE
      - name: Esperar el rollout
        # PowerShell no corta al primer comando que falla: hay que mirar el código
        # de salida de cada kubectl, o un rollout caído pasaría por bueno.
        run: |
          foreach ($despliegue in "db", "api", "web") {
            kubectl -n demo-staging rollout status "deploy/$despliegue" --timeout=180s
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Smoke test
        run: |
          & $env:GIT_BASH -eo pipefail scripts/smoke.sh http://localhost:30090
          exit $LASTEXITCODE
      - name: Resumen del despliegue
        if: always()
        run: |
          $lineas = @(
            '## STAGING',
            '',
            '- URL: http://localhost:30090',
            '- Imágenes: `sha-${{ github.sha }}`',
            '- Aprobado por: @${{ github.actor }}'
          ) -join "`n"
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "$lineas`n", $utf8)
