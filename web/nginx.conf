# nginx sirve la página y reenvía /api/ al backend.
# Escucha en 8080 porque la imagen corre sin root (nginx-unprivileged), y sin root no se puede usar el puerto 80.
server {
    listen 8080;

    # Cabeceras de seguridad. Las pidió OWASP ZAP en el baseline scan del pipeline:
    # sin ellas el navegador aplica sus comportamientos más permisivos.
    server_tokens off;                                   # no publicar la versión de nginx
    add_header X-Content-Type-Options "nosniff" always;  # no adivinar el tipo de archivo
    add_header X-Frame-Options "DENY" always;            # no permitir enmarcar la página (clickjacking)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # La página solo carga recursos propios. Sin 'unsafe-inline': el HTML no tiene
    # estilos en línea, todo viene de estilos.css, así que permitirlos solo debilitaba
    # la política sin que nada lo necesitara. Lo señaló ZAP (10055).
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Aislamiento entre sitios, contra ataques tipo Spectre. Lo pidió ZAP (90004):
    # impiden que otra pestaña comparta proceso con esta o se lleve sus recursos.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La API vive en otro contenedor. El navegador nunca la ve directamente.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 5s;
    }

    # Las métricas de la API son para Prometheus, no para Internet.
    location /metrics {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
