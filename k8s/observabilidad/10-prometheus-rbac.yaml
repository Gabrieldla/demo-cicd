# Prometheus descubre los pods a los que tiene que leer las métricas preguntándole
# a la API de Kubernetes. Para eso necesita permiso, y SOLO de lectura: puede ver
# pods, services y endpoints, y nada más. No puede crear, modificar ni borrar nada.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: observabilidad
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-lectura
rules:
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-lectura
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-lectura
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: observabilidad
